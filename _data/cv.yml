- title: Research and Engineering Experience
  type: time_table
  contents:
    - title: Drone-borne Cloud Droplet Retrieval
      institution: University of Cambridge, Centre for Climate Repair context
      year: 2025-26
      description:
        - "Built the measurement system for a difficult question in marine cloud brightening: can a small drone resolve cloud droplet size changes finely enough to follow a field experiment?"
        - "Developed a 500 g optical payload for a 7.5 inch drone, combining a polarisation camera, Raspberry Pi 4, SSD storage, separate flight and payload power, and a protective mechanical assembly."
        - "Processed and stored up to 125 MB/s of camera data in real time, then wrote the Python retrieval pipeline for video processing, computer vision, angular profile extraction, and lookup-table fitting."
        - "Retrieved droplet size distributions at about 3 m by 3 m spatial resolution, roughly one to two orders of magnitude finer than current satellite and aircraft approaches, with fitting RMSE below 1% of peak signal magnitude."
      linkitems:
        - link: "/projects/12_drone_cloud_droplet_measurement/"
          linkname: case study
        - link: "/projects/10_cloudbow_lut/"
          linkname: LUT explorer
        - link: "https://www.climaterepair.cam.ac.uk/"
          linkname: CCR
    - title: Funded Summer Researcher
      institution: Centre for Climate Repair, University of Cambridge
      year: Jul-Aug 2025
      description:
        - "Worked on remote sensing of cloud microphysical properties for marine cloud brightening, supervised by Professor Hugh Hunt."
        - "Designed early integrations for nanoparticle size distribution sensors and a polarisation camera on a compact UAV, linking payload mass, optics, sensing requirements, and flight constraints."
      linkitems:
        - link: "https://www.climaterepair.cam.ac.uk/"
          linkname: CCR
    - title: Project Manager of Feed Systems
      institution: Cambridge University Spaceflight
      year: 2023-26
      description:
        - "Led actuated high-pressure flow regulation work for the society's upcoming propulsive landing rocket, turning throttling requirements into feed-system architecture."
        - "Built feed systems for a NASA hydrogen torch ignitor used in the society's most powerful engine work, balancing choked-flow analysis, orifice sizing, pressure ratings, cost, and assembly practicality."
        - "Produced CAD, P&IDs, component selections, and build plans that let other teams request and trust the flow conditions they needed."
      linkitems:
        - link: "https://www.cusf.co.uk/"
          linkname: CUSF
    - title: Summer Engineering Intern
      institution: Limosaero Ltd.
      year: Jul-Sep 2024
      description:
        - "Worked on the company's 6 m wingspan solar UAV and atmospheric monitoring payload, spanning design, simulation, manufacture, and tool-building."
        - "Used SolidWorks CFD and boundary-layer theory to shape a sensor housing that delivered the required inlet flow, slowed and directed the sample for accurate retrieval, and returned higher-momentum air into the boundary layer to reduce drag."
        - "Built the company's first aeroelasticity design tool in Python, about 2000 lines, modelling carbon-fibre layup stiffness and aero-mechanical load response so design changes could be explored interactively."
        - "Structured the tool with clear data classes and visual failure alerts, making the code easier to extend and the design trade-offs easier to see."
      linkitems:
        - link: "https://www.limosaero.co.uk"
          linkname: Limosaero
    - title: CUES-funded Atmospheric Profiling Drone
      institution: Cambridge University Engineering Society funded personal project
      year: 2025-26
      description:
        - "Built an ESP32-based atmospheric profiling payload for a sub-250 g drone, with inertial sensing, temperature and humidity sensing, microSD logging, and ground telemetry."
        - "Turned raw logs into altitude-resolved profiles by synchronising payload data with drone flight records, then used field runs to characterise a nocturnal temperature inversion, daytime temperature profile, and near-ground wind-velocity structure."
      linkitems:
        - link: "/projects/11_atmospheric_profiling_drone/"
          linkname: project page
    - title: Weather Drone Design and Research Assistant
      institution: The University of Hong Kong
      year: Jul-Sep 2023
      description:
        - "Collaborated with Professor Chun-Ho Liu's air pollution lab on drone-based atmospheric turbulence measurement for urban pollutant transport research."
        - "Integrated a third-party anemometer onto a DJI drone through lightweight mechanical changes and custom logging code."
        - "Designed and built a lightweight data logger for 100 Hz multi-sensor logging, then supported test flights and Hong Kong government site visits."

